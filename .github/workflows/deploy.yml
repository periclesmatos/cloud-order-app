name: Deploy Production

on:
  push:
    branches:
      - production

jobs:
  # ============================================
  # BUILD: Build da aplicação
  # ============================================
  build:
    name: 🔨 Build Application
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache de node_modules
        uses: actions/cache@v4
        id: cache
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Instalar dependências
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci --silent

      - name: 🔨 Build da aplicação
        run: npm run build

      - name: 📦 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: dist/
          retention-days: 30

  # ============================================
  # DEPLOY: Deploy na EC2
  # ============================================
  deploy:
    name: 🚀 Deploy na EC2
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: 🔐 Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: 🚀 Deploy na EC2 (Git + Docker Compose)
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF
            set -e
            
            echo "📍 Entrando no diretório da aplicação (frontend)..."
            cd ${{ secrets.APP_DIR }}/front
            
            echo "🔄 Atualizando repositório (production)..."
            git fetch origin production --force
            git reset --hard origin/production
            
            echo "📦 Reconstruindo e iniciando containers..."
            docker compose -f docker-compose.yml pull
            docker compose -f docker-compose.yml up -d --build
            
            echo "🔍 Verificando saúde dos containers..."
            sleep 5
            docker ps -a
            
            echo "✅ Deploy do frontend concluído com sucesso!"
          EOF

      - name: 📢 Notificação de Sucesso
        if: success()
        run: echo "✅ Deploy frontend realizado com sucesso em $(date)"

      - name: 📢 Notificação de Erro
        if: failure()
        run: echo "❌ Erro durante o deploy frontend. Verifique os logs."
