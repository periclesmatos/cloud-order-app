version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
        VITE_API_TIMEOUT: ${VITE_API_TIMEOUT:-10000}
        VITE_REQUIRE_HTTPS: ${VITE_REQUIRE_HTTPS:-true}
    container_name: cloud-order-frontend
    ports:
      - '${FRONTEND_PORT:-3001}:3000'
    restart: always
    environment:
      - NODE_ENV=production
    networks:
      - cloud-order-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  cloud-order-network:
    driver: bridge
