version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://3.17.62.139:3000}
        VITE_API_TIMEOUT: ${VITE_API_TIMEOUT:-10000}
        VITE_REQUIRE_HTTPS: ${VITE_REQUIRE_HTTPS:-false}
    container_name: cloud-order-frontend
    ports:
      - '8080:8080'
    restart: unless-stopped
    networks:
      - cloud-order-network
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:8080']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

networks:
  cloud-order-network:
    driver: bridge
