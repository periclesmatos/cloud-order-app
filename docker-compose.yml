version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloud-order-frontend
    ports:
      - '8080:8080'
    environment:
      - VITE_API_URL=http://localhost:3000
    restart: unless-stopped
    networks:
      - cloud-order-network
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:8080']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  cloud-order-network:
    driver: bridge
